---
services:
  openvoxserver:
    image: ghcr.io/openvoxproject/openvoxserver:latest
    hostname: puppet
    environment:
      OPENVOXSERVER_HOSTNAME: puppet
      CSR_ATTRIBUTES: '{ "custom_attributes": { "challengePassword": "foobar" }, "extension_requests": { "pp_project": "foo" } }'
      # For private repos, use git@github.com:user/repo.git and provide SSH keys
      # R10K_REMOTE: https://github.com/betadots/demo-control-repo.git
    volumes:
      - openvoxserver-ssl:/etc/puppetlabs/puppet/ssl
      - openvoxserver-ca:/etc/puppetlabs/puppetserver/
      - ./controlrepo:/etc/puppetlabs/code
    restart: always
    ports:
      - 8140:8140
    healthcheck:
      test: ["CMD-SHELL", "curl -ksS https://puppet:8140/status/v1/simple | grep -q '^running$'"]
      interval: 10s
      timeout: 5s
      retries: 5

  openvoxdb:
    image: ghcr.io/openvoxproject/openvoxdb:latest
    hostname: openvoxdb
    restart: always
    depends_on:
      openvoxserver:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -ksS https://openvoxdb:8081/status/v1/simple | grep -q '^running$'"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 8081:8081

  postgres:
    image: docker.io/postgres:17-alpine
    hostname: postgres
    environment:
      - POSTGRES_DB=openvoxdb
      - POSTGRES_USER=openvoxdb
      - POSTGRES_PASSWORD=openvoxdb
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U openvoxdb -d openvoxdb'"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - openvoxdb-postgres:/var/lib/postgresql/data
      - ./container/postgresql_init:/docker-entrypoint-initdb.d
    restart: always

networks:
  default:
    name: openvox-lab

volumes:
  openvoxdb-postgres:
  openvoxserver-ssl:
  openvoxserver-ca:
